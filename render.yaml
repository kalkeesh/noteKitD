services:
  - type: web
    name: notekit-core-backend
    env: python
    rootDir: backend-core
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGO_DB_NAME
        value: NOTEkiT
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: OTP_EXPIRE_MINUTES
        value: "10"
      - key: PASSWORD_RESET_WINDOW_MINUTES
        value: "15"
      - key: BUDGETIFY_API_BASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: notekit-budgetify-backend
    env: python
    rootDir: backend-budgetify
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGO_DB_NAME
        value: NOTEkiT
      - key: JWT_ALGORITHM
        value: HS256
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
